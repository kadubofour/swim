<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | PrinceSwim</title><meta name="description" content="Register your swimmer for lessons or training."><meta name="theme-color" content="#06182b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head>
<body data-page="register"><div id="site-header"></div>
<main id="main">
<div class="hero page" data-bg="assets/img/learn.jpg"><div class="wrap inner"><div class="kicker">Join us</div><h1>Register</h1><p class=sub>Fill in the form and we will confirm your spot.</p></div></div>
<section class="tint"><div class="wrap"><div class="formcard" style="max-width:760px;margin:-120px auto 0;position:relative">
<form id="reg-form"><label>Level<select id="program" name="program" required></select></label>
<div class="row2"><label>Swimmer name<input name="swimmer" required></label><label>Swimmer age<input name="age" type="number" min="3" max="99" required></label></div>
<div class="row2"><label>Parent / guardian<input name="parent" required></label><label>Phone<input name="phone" type="tel" required></label></div>
<label>Email<input name="email" type="email" required></label>
<label>Emergency contact (name &amp; phone)<input name="emergency" required></label>
<label>Medical notes / allergies (optional)<textarea name="medical" rows="3"></textarea></label>
<input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
<label class="check"><input type="checkbox" name="waiver" value="yes" required><span>I accept the liability waiver and confirm the details above are correct. (Placeholder: add waiver text, have it reviewed.)</span></label>
<p class="note">Your registration is saved, then a prefilled message opens so you can send it to us too. Payment details will be shared once your spot is confirmed.</p>
<button class="btn" type="submit" style="color:var(--navy)">Submit registration</button></form>
<p id="status" class="note" hidden role="status" style="margin-top:16px"></p>
<p id="done" class="note" hidden style="margin-top:16px">If nothing opened, <a id="done-link" href="#">tap here to send your registration</a>.</p>
</div></div></section>

</main>
<div id="site-footer"></div>
<script src="site.config.js"></script><script src="assets/main.js"></script></body></html>
